<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Tablyo · Administration</title>
<style nonce="__NONCE__">
:root{
  --teal:#0E7C86;--teal-d:#0a5d65;--teal-l:#d9eef0;--ink:#0B1F2A;--saffron:#F2A93B;
  --bg:#F3F5F4;--surface:#fff;--surface2:#eef2f1;--line:#dde4e2;--text:#0B1F2A;--text2:#4A5B66;
  --ok:#1f8a4c;--ok-bg:#e0f3e7;--warn:#b86e00;--warn-bg:#fdf0d8;--bad:#c0392b;--bad-bg:#fbe3e0;--info:#0E7C86;--info-bg:#d9eef0;
  --r1:14px;--r2:20px;--r3:24px;--shadow:0 1px 2px rgba(11,31,42,.06),0 6px 24px rgba(11,31,42,.06);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme=dark]{
  --bg:#0a1419;--surface:#111e25;--surface2:#16262f;--line:#22353f;--text:#e8f0f2;--text2:#98adb6;
  --teal:#2bb5c0;--teal-d:#1d8f99;--teal-l:#12333a;--ok:#4cc380;--ok-bg:#12301f;--warn:#f2a93b;--warn-bg:#3a2a0d;--bad:#ff7b6b;--bad-bg:#3b1815;--info:#2bb5c0;--info-bg:#12333a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--text2)}.small{font-size:13px}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.right{margin-left:auto}
.stack{display:flex;flex-direction:column;gap:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r1);border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.icon{width:44px;padding:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.bad{border-color:var(--bad);color:var(--bad)}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--text2)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r1);background:var(--surface);color:var(--text)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:20px;height:20px;min-height:0;accent-color:var(--teal)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:18px;box-shadow:var(--shadow)}
.card h2{margin-bottom:12px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi{all:unset;box-sizing:border-box;display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px;box-shadow:var(--shadow);cursor:pointer;min-height:96px}
.kpi:hover{border-color:var(--teal)}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;font-family:var(--font)}
.kpi .l{color:var(--text2);font-size:13px;font-weight:600}
.kpi .s{color:var(--text2);font-size:12.5px;margin-top:2px}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--info-bg);color:var(--info)}.b-mute{background:var(--surface2);color:var(--text2)}

/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--ink);color:#e8f0f2;padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.side .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--teal);display:grid;place-items:center;color:#fff;font-weight:800}
.side a.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:12px;color:#b8c9cf;text-decoration:none;font-weight:600}
.side a.nav:hover{background:#16313b;color:#fff}
.side a.nav[aria-current=page]{background:var(--teal);color:#fff}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.content{padding:20px;max-width:1280px;margin:0 auto;padding-bottom:100px}
.env{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.env.prod{background:var(--bad-bg);color:var(--bad)}.env.test{background:var(--warn-bg);color:var(--warn)}.env.local{background:var(--info-bg);color:var(--info)}
.tabbar{display:none}
@media(max-width:899px){
  .shell{grid-template-columns:1fr}.side{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;font-size:11px;font-weight:700;color:var(--text2);text-decoration:none;border-radius:12px}
  .tabbar a[aria-current=page]{color:var(--teal);background:var(--teal-l)}
  .content{padding:14px 12px 100px}
  h1{font-size:21px}
}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:12px;top:12px;color:var(--text2)}
.search input{padding-left:40px}
.bulk{position:sticky;top:62px;z-index:4;background:var(--ink);color:#fff;border-radius:var(--r1);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bulk .btn{background:#16313b;border-color:#2a4854;color:#fff}.bulk .btn.danger{background:var(--bad)}

/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.tbl th{position:sticky;top:0;text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover td{background:var(--surface2)}
.tbl td.chk,.tbl th.chk{width:44px;padding-right:0}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--teal-l);color:var(--teal);display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.who .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who .e{font-size:13px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tblwrap{overflow-x:auto}
@media(max-width:899px){
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl thead{display:none}.tbl{border:0;background:transparent}
  .tbl tr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);position:relative}
  .tbl td{border:0;padding:4px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .tbl td::before{content:attr(data-label);color:var(--text2);font-size:12.5px;font-weight:600}
  .tbl td.main-cell::before,.tbl td.chk::before{content:none}
  .tbl td.chk{position:absolute;right:10px;top:10px;width:auto}
}
.pager{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px}
.empty{text-align:center;padding:48px 16px;color:var(--text2)}
.empty svg{width:40px;height:40px;opacity:.5}

/* drawer & modal */
.veil{position:fixed;inset:0;background:rgba(5,15,20,.55);z-index:40;display:flex}
.drawer{margin-left:auto;width:min(620px,100%);background:var(--bg);height:100%;overflow-y:auto;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.drawer .dh{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:center}
.drawer .db{padding:16px;display:flex;flex-direction:column;gap:14px}
.modalv{align-items:center;justify-content:center;padding:14px}
.modal{background:var(--surface);border-radius:var(--r3);width:min(520px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:var(--shadow)}
.modal h2{margin-bottom:14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@media(max-width:560px){.modalv{align-items:flex-end;padding:0}.modal{border-radius:var(--r3) var(--r3) 0 0;width:100%}}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:0}
.dl dt{color:var(--text2);font-size:13px;font-weight:600}.dl dd{margin:0;min-width:0;word-break:break-word}
.notice{border-radius:var(--r1);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-bg);color:var(--warn)}.notice.info{background:var(--info-bg);color:var(--info)}.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice b{color:inherit}
.preview{background:var(--surface2);border-radius:var(--r1);padding:12px 14px;font-weight:600}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:flex;gap:12px}.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);margin-top:6px;flex:none}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px)}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r1);box-shadow:var(--shadow);font-weight:600;width:100%}
.toast.err{background:var(--bad)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(420px,100%);padding:28px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.chart text{fill:var(--text2);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--teal);font-weight:600}
pre.json{background:var(--surface2);border-radius:10px;padding:10px;overflow:auto;font-size:12px;margin:6px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script nonce="__NONCE__">
"use strict";
/* ───────── utilitaires ───────── */
const NS = "http://www.w3.org/2000/svg";
const ICONS = {

  search:"M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3",
  plus:"M12 5v14M5 12h14", x:"M18 6 6 18M6 6l12 12", check:"M20 6 9 17l-5-5",
  copy:"M9 9h11v11H9zM5 15H4V4h11v1", trash:"M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14",
  edit:"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z",

  download:"M12 3v12M7 10l5 5 5-5M5 21h14", phone:"M7 2h10v20H7zM12 18h.01",
  alert:"M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z",
  moon:"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z",
  sun:"M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",
  star:"M12 2l3 7 7 .6-5.3 4.7 1.6 7.2L12 17.8 5.7 21.5l1.6-7.2L2 9.6 9 9z",
  chev:"M9 6l6 6-6 6", ban:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M4.9 4.9l14.2 14.2",
  undo:"M3 7v6h6M3 13a9 9 0 1 0 3-7.7", key:"M21 2l-9.6 9.6M15.5 7.5l3 3M7.5 20a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11"
};
function icon(name){
  const s = document.createElementNS(NS,"svg");
  s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("class","i"); s.setAttribute("aria-hidden","true");
  const p = document.createElementNS(NS,"path"); p.setAttribute("d",ICONS[name]||""); s.appendChild(p); return s;
}
const PROPS = new Set(["value","checked","disabled","selected","htmlFor","readOnly","type","min","max","step","maxLength","autocomplete","inputMode","rows"]);
function add(el,kids){ for(const k of kids.flat(Infinity)){ if(k==null||k===false) continue; el.appendChild(k instanceof Node?k:document.createTextNode(String(k))); } }
function h(tag,props,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false) continue;
    if(k==="class") el.className=v;
    else if(k==="style") Object.assign(el.style,v);
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(PROPS.has(k)) el[k]=v;
    else el.setAttribute(k,v===true?"":v);
  }
  add(el,kids); return el;
}
const $ = (s,r=document)=>r.querySelector(s);
const nf = new Intl.NumberFormat("fr-FR");
const money = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"USD",maximumFractionDigits:2}).format(n||0);
function fmtDate(iso,short){ if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return "—";
  return d.toLocaleString("fr-FR",short?{day:"2-digit",month:"short",year:"numeric"}:{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function rel(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; const s=(d-Date.now())/1000,a=Math.abs(s);
  const f=(n,u)=>{const v=Math.max(1,Math.round(n));return s>0?`dans ${v} ${u}`:`il y a ${v} ${u}`};
  if(a<60) return "à l'instant"; if(a<3600) return f(a/60,"min"); if(a<86400) return f(a/3600,"h");
  if(a<86400*90) return f(a/86400,"j"); if(a<86400*730) return f(a/86400/30,"mois"); return f(a/86400/365,"ans"); }
function dateRel(iso){ return iso? `${fmtDate(iso)} · ${rel(iso)}` : "—"; }
function initials(a){ const t=((a.first_name||"")+" "+(a.last_name||"")).trim()||a.email||"?"; return t.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase(); }
function fullName(a){ return ((a.first_name||"")+" "+(a.last_name||"")).trim(); }
function debounce(fn,ms){ let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms)}; }
function toast(msg,err){ const t=h("div",{class:"toast"+(err?" err":"")},msg); $("#toasts").appendChild(t); setTimeout(()=>t.remove(),err?6000:3200); }
async function copy(text,label){ try{ await navigator.clipboard.writeText(text); toast((label||"Texte")+" copié"); }catch{ toast("Copie impossible",true); } }

/* ───────── état & API ───────── */
const S = {
  token: sessionStorage.getItem("tb_token"), exp: sessionStorage.getItem("tb_exp"),
  plans: [], stats: null, route: "dashboard",
  acc: {q:"",status:"all",plan:"",sort:"created_at",dir:"desc",page:1,size:25,sel:new Set(),data:null,loading:false},
  audit: {filter:"",items:[],total:0,loading:false}
};
const UNITS = ["Minutes","Heures","Jours","Mois","Ans"];
const unitDays = {Minutes:1/1440,Heures:1/24,Jours:1,Mois:30,Ans:365};

async function api(path,{method="GET",body,blob}={}){
  const headers={}; if(S.token) headers.Authorization="Bearer "+S.token; if(body!==undefined) headers["Content-Type"]="application/json";
  let r; try{ r=await fetch(path,{method,headers,body:body!==undefined?JSON.stringify(body):undefined}); }
  catch{ throw new Error("Serveur injoignable. Vérifiez votre connexion (le serveur gratuit peut mettre ~1 min à se réveiller)."); }
  if(r.status===401 && !path.startsWith("/api/admin/session")){ logout("Session expirée : reconnectez-vous."); throw new Error("Session expirée"); }
  if(!r.ok){ let m="Erreur "+r.status; try{ const j=await r.json(); m=typeof j.detail==="string"?j.detail:(j.detail&&j.detail[0]&&j.detail[0].msg)||m; }catch{} throw new Error(m); }
  return blob? r : r.json();
}
let expTimer;
function startSession(token,exp){ S.token=token; S.exp=exp; sessionStorage.setItem("tb_token",token); sessionStorage.setItem("tb_exp",exp);
  clearTimeout(expTimer); const ms=new Date(exp)-Date.now()-60000; if(ms>0&&ms<2**31) expTimer=setTimeout(()=>toast("Votre session expire dans 1 minute. Enregistrez votre travail.",true),ms); }
function logout(msg){ S.token=null; sessionStorage.removeItem("tb_token"); sessionStorage.removeItem("tb_exp"); clearTimeout(expTimer); closeAll(); render(msg); }
function envBadge(){ const h=location.hostname; if(h==="localhost"||h==="127.0.0.1") return ["local","Local"]; if(/test/i.test(h)) return ["test","Test"]; return ["prod","Production"]; }

/* ───────── libellés ───────── */

/* ───────── routeur ───────── */
function render(msg){
  const app=$("#app");
  if(!S.token){ S.route="login"; app.replaceChildren(viewLogin(msg)); return; }
  const m=location.hash.replace(/^#\//,"").split("/"); let route=m[0]||"dashboard"; if(!NAV.some(n=>n[0]===route)) route="dashboard";
  S.route=route; const box=h("div"); app.replaceChildren(shell(box)); closeAll();
  ({dashboard:viewDashboard,accounts:viewAccounts,plans:viewPlans,orgs:viewOrgs,news:viewNews,audit:viewAudit,settings:viewSettings})[route](box);
  if(route==="accounts"&&m[1]&&/^\d+$/.test(m[1])) openAccount(parseInt(m[1],10));
  document.title="Tablyo · "+(NAV.find(n=>n[0]===route)||[0,"Administration"])[1];
}
window.addEventListener("hashchange",()=>{ const m=location.hash.replace(/^#\//,"").split("/");
  if(S.token&&S.route==="accounts"&&m[0]==="accounts"){ // même vue : ne recharge que le tiroir
    layers.forEach(l=>l.remove()); layers=[]; document.body.style.overflow=""; if(m[1]&&/^\d+$/.test(m[1])) openAccount(parseInt(m[1],10)); return; }
  render(); });
document.documentElement.dataset.theme=localStorage.getItem("tb_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
if(S.token&&S.exp&&new Date(S.exp)>Date.now()) startSession(S.token,S.exp); else { S.token=null; }
render();
